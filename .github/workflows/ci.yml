name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint (ruff)
        run: python -m ruff check yhwach/ tests/
      - name: Test (pytest)
        run: python -m pytest -q
      - name: Golden fixtures (selftest)
        run: yhwach selftest

  package:
    name: wheel install (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install the wheel into a clean venv (no repo on path)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install dist/yhwach-*.whl
      - name: Smoke-test the installed package (data files must be bundled)
        run: |
          cd /tmp                       # away from the repo so only packaged data resolves
          /tmp/venv/bin/yhwach --version
          /tmp/venv/bin/yhwach engage --lab ci --scope 10.0.0.0/24 --db /tmp/ci.db
          /tmp/venv/bin/yhwach plan --lab ci --db /tmp/ci.db
          /tmp/venv/bin/yhwach persona | tail -1
          /tmp/venv/bin/yhwach selftest
