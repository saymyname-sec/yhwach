# Arsenal index — vendored offensive tooling under <repo>/arsenal/.
# Queryable offline via `yhwach ref arsenal [-q <term>]`. Tiers:
#   canonical  — battle-tested primary path; reach for these first.
#   quick-win  — opportunistic, surface-specific shortcut; NOT a substitute
#                for exhaustive manual enumeration with the full Kali toolset.
#   deep       — heavier/destructive; render-only, authorized engagements only.
# Paths are relative to the repo root unless marked (apt) / (system).

# ── Canonical foothold + pivot (proven on AV-enabled targets) ──────────
- name: gen_cs_shell.sh
  key: REVSHELL_GEN_WIN
  tier: canonical
  os: windows
  surface: foothold
  purpose: C# reverse-shell generator (4-byte XOR strings, per-run random symbols, reconnect+jitter). Reliably lands a shell on Win11 with AV enabled. Default Windows foothold.
  path: arsenal/gen_cs_shell.sh
  invoke: yhwach revshell --os win --lport <PORT>   # renders the gen + compile (mcs/csc) + drop
  note: fresh LPORT per host, record it. Compile on Kali (mcs) or target (csc.exe).

- name: svcmon.exe
  key: SVCMON_WIN
  tier: canonical
  os: windows
  surface: pivot
  purpose: Obfuscated, AV/Defender-evasive ligolo-ng Windows agent. Default Windows pivot when a new subnet must be reached.
  path: arsenal/svcmon.exe   # sha256-pinned in yhwach.arsenal
  invoke: yhwach pivot --lab <L> --via-host <IP> --subnet <CIDR>   # renders svcmon deploy + route
  deps: ligolo-proxy on Kali (apt); a fresh persistence port per host.

- name: gen_linux_shell.sh
  key: REVSHELL_GEN_LINUX
  tier: canonical
  os: linux
  surface: foothold
  purpose: Emits 7 Linux reverse-shell payloads (bash /dev/tcp, python PTY, socat, nc mkfifo, perl, php, ELF) pre-filled with LHOST/LPORT.
  path: arsenal/gen_linux_shell.sh
  invoke: yhwach revshell --os linux --lport <PORT>

- name: ligolo-agent
  key: LIGOLO_AGENT_LINUX
  tier: canonical
  os: linux
  surface: pivot
  purpose: Linux ligolo-ng agent (x86-64 ELF) — copy to a Linux target to tunnel back.
  path: /usr/bin/ligolo-agent   # (apt) ligolo-ng package
  invoke: yhwach pivot --lab <L> --via-host <IP> --subnet <CIDR> --kind ligolo

- name: ligolo-proxy
  key: LIGOLO_PROXY
  tier: canonical
  os: linux
  surface: pivot
  purpose: Kali-side ligolo-ng proxy; terminates agent tunnels on a tun interface.
  path: /usr/bin/ligolo-proxy   # (apt) ligolo-ng package
  invoke: sudo ligolo-proxy -selfcert   # then `session` / `start` / `ifconfig` inside the console
  deps: root for the tun interface.

- name: chisel
  key: CHISEL
  tier: canonical
  os: any
  surface: pivot
  purpose: Reverse-SOCKS pivot, no root needed on target or Kali. Default Linux pivot fast path.
  path: /usr/local/bin/chisel   # (system)
  invoke: yhwach pivot --lab <L> --via-host <IP> --subnet <CIDR> --kind chisel

# ── Loaders / encoders (shellcode delivery) ──────────────────────────────────
- name: loader_windows.py
  tier: quick-win
  os: windows
  surface: loader
  purpose: W^X in-memory shellcode loader (VirtualAlloc RW -> VirtualProtect RX). Optional XOR + SHA256 checksum.
  path: arsenal/loader_windows.py
  invoke: python loader_windows.py shellcode.bin [--key 0xHEX --checksum <sha256>]

- name: loader_linux.py
  tier: quick-win
  os: linux
  surface: loader
  purpose: Linux W^X loader (mmap/mprotect). Same CLI/XOR/checksum contract as loader_windows.py.
  path: arsenal/loader_linux.py
  invoke: python3 loader_linux.py shellcode.bin [--key 0xHEX --checksum <sha256>]

- name: xor_encrypt_bin.py
  tier: quick-win
  os: any
  surface: loader
  purpose: Pre-encrypt raw shellcode (XOR) before dropping; prints plaintext SHA256 + ready loader command.
  path: arsenal/xor_encrypt_bin.py
  invoke: python3 xor_encrypt_bin.py shellcode.bin [--key 0xHEX]

- name: msfconsole/build.sh
  tier: quick-win
  os: windows
  surface: loader
  purpose: Build a custom AMSI/firewall-evasive .NET loader for a msfvenom payload (see msfconsole/cheatsheet.md, handler.rc).
  path: arsenal/msfconsole/build.sh
  invoke: bash arsenal/msfconsole/build.sh   # read arsenal/msfconsole/cheatsheet.md

