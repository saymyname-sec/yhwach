# Yhwach — offline CPE/version -> CVE knowledge base.
#
# Curated for services commonly found in security-assessment labs, with
# the AI-stack CVEs first (Yhwach doctrine ranks AI hosts above traditional).
# `yhwach vulns` matches each `software` row against these entries and records a
# `vulnerability` row; entries with an `exploit` also emit an `exploitable_cve`
# finding so the exploit_known_cve rule can chain.
#
# Match:  entry matches a software row when (product substring in software.name
#         OR cpe substring in software.cpe), case-insensitive, AND the software
#         version satisfies `affected`.
# affected grammar:  "<x" "<=x" ">x" ">=x" "==x", comma-AND ranges (">=2.0,<2.17.1"),
#         or "*" (any version — version-agnostic, e.g. an unauth-by-default service).

