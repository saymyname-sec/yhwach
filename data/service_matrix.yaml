# Yhwach — the service matrix: ONE source of truth for service identity.
# `yhwach ref services [--query redis]`.
#
# Service identity is otherwise spread across PORT_KIND / _PRODUCT_KIND / WEB_PORTS /
# PROBES_BY_PORT / surface.kind / rule `surface:` / ref packs / default_creds / cve_map —
# eight places that can drift apart (that drift is the service-identity-drift bug class). This file
# is the reference they are tested against (see tests/test_service_matrix.py).
#
# Schema per row:
#   kind          canonical surface kind (== surface.kind == PORT_KIND value when port-classified)
#   aka           other names it appears under
#   tcp_ports     default TCP ports (asserted against PORT_KIND for classify:[port] rows)
#   udp_ports     default UDP ports
#   classify      how it is identified: [port] | [product] | [probe] | [fingerprint] (any combination)
#   surface_kind  the surface.kind a rule keys on with `surface:`  (usually == kind)
#   rules         playbook rule ids that consume this surface (may be empty until a later slice)
#   ref_pack      the `yhwach ref` pack for its recall menu (may not exist until a later slice)
#   default_creds true when data/default_creds.yaml has a row
#   cve_products  product strings matched in data/cve_map.yaml
#   taxonomy      the standard IDs this surface's techniques carry
#   enum_ref      one-line "how to triage it" (mirrors coverage._ENUM_REF)
#   service_enum  true when a live-but-untriaged surface should raise a service_enum gap

