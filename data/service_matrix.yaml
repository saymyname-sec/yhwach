# ---------------------------------------------------------------------------
# Traditional / AD services. These are the most common surfaces in any engagement and
# had no row at all, so a Domain Controller got no triage context anywhere —
# `yhwach ref services smb` and the per-host dossier both returned nothing.
#
# service_enum: false on every one of them. They are already covered by the AD
# and web playbooks, and flipping them on would flood `yhwach gaps` with a
# service_enum debt the operator did not previously owe.
# ---------------------------------------------------------------------------
- {kind: smb, aka: [microsoft-ds, netbios-ssn, cifs], tcp_ports: [139, 445], classify: [port, product], surface_kind: smb, ref_pack: wadcoms, default_creds: false, taxonomy: [T1135, T1087.002], enum_ref: "null/guest session -> shares, users (RID brute), password policy; signing off -> relay", service_enum: false}
