- {kind: kerberos, aka: [kerberos-sec], tcp_ports: [88], classify: [port, product], surface_kind: kerberos, ref_pack: wadcoms, default_creds: false, taxonomy: [T1558.003, T1558.004], enum_ref: "user enum via AS-REQ; AS-REP roast (no preauth); kerberoast SPNs once authed", service_enum: false}
