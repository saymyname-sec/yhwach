# Yhwach — the chaining-tag registry: the memory's data dictionary.
# `yhwach ref tags [--query seimpersonate]`.
#
# The memory is indexed on THREE orthogonal tag axes:
#   surface   -> surface.kind / rule `surface:`      (what it IS)         -> service_matrix.yaml
#   state     -> finding.tag / rule `findings_include`(what we PROVED)    -> THIS file
#   taxonomy  -> finding.class / rule `maps:`         (what it MEANS)     -> public IDs
#
# This file documents the STATE axis. The invariant "every chaining tag has a
# producer and a consumer, or it is dead" is enforced by tests/test_tag_graph.py
# (computed from code, so this file need not be exhaustive to be safe).
#
# Schema: tag, producer[] (code that emits it), consumers[] (rules that key on it),
#         implies[] (taxonomy), status (live | dead), note.

