<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 210' width='780' height='210' role='img' aria-label='yhwach'><style>.eye-pupil{transform-box:fill-box;transform-origin:center;animation:glance 7s ease-in-out infinite}.crest-blink{transform-box:fill-box;transform-origin:center;animation:eyeblink 5.3s ease-in-out infinite}@keyframes glance{0%,18%{transform:translate(0,0)}25%,40%{transform:translate(1.5px,-.5px)}47%,61%{transform:translate(-1.5px,.35px)}68%,82%{transform:translate(.4px,1.2px)}89%,100%{transform:translate(0,0)}}@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.eye-pupil,.crest-blink{animation:none}}</style><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#0a0509'/><stop offset='100%' stop-color='#1a0e18'/></linearGradient><radialGradient id='glow' cx='13%' cy='50%' r='34%'><stop offset='0%' stop-color='#e83bb0' stop-opacity='.18'/><stop offset='100%' stop-color='#e83bb0' stop-opacity='0'/></radialGradient></defs><rect width='780' height='210' rx='22' fill='url(#bg)'/><rect x='1' y='1' width='778' height='208' rx='21' fill='none' stroke='#5a3a53' stroke-opacity='.5'/><rect width='780' height='210' rx='22' fill='url(#glow)'/><g transform='translate(30,50) scale(1.8)'><path d='M6 44 C18 22 27 48 33 30 C39 14 49 24 59 42' stroke='#e83bb0' stroke-opacity='.30' stroke-width='1.5' fill='none' stroke-linecap='round'/><path d='M11 15 C25 31 41 9 55 21' stroke='#8a1f68' stroke-opacity='.55' stroke-width='1.3' fill='none' stroke-linecap='round'/><path d='M18 48 C27 35 37 41 47 47' stroke='#e83bb0' stroke-opacity='.22' stroke-width='1.2' fill='none' stroke-linecap='round'/><path d='M32 6 C28 18 40 22 34 34' stroke='#8a1f68' stroke-opacity='.4' stroke-width='1.1' fill='none' stroke-linecap='round'/><g class='crest-blink' style='transform-box:fill-box;transform-origin:center'><g transform='translate(19 23) rotate(34)'><path d='M-11 0 Q0 -6.5 11 0 Q0 6.5 -11 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='34' data-travel='1.9'><circle cx='-1.5' cy='1.5' r='3.90' fill='#e83bb0' fill-opacity='.42'/><circle cx='-1.5' cy='1.5' r='1.64' fill='#f7d7ee'/><circle cx='-2.87' cy='0.14' r='0.62' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(45 22) rotate(-32)'><path d='M-10 0 Q0 -6 10 0 Q0 6 -10 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='-32' data-travel='1.8'><circle cx='2' cy='0' r='3.60' fill='#e83bb0' fill-opacity='.42'/><circle cx='2' cy='0' r='1.51' fill='#f7d7ee'/><circle cx='0.74' cy='-1.26' r='0.58' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(31 12) rotate(6)'><path d='M-8 0 Q0 -4.5 8 0 Q0 4.5 -8 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='6' data-travel='1.3'><circle cx='0' cy='1' r='2.70' fill='#e83bb0' fill-opacity='.42'/><circle cx='0' cy='1' r='1.13' fill='#f7d7ee'/><circle cx='-0.94' cy='0.06' r='0.43' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(11 33) rotate(64)'><path d='M-7 0 Q0 -4.2 7 0 Q0 4.2 -7 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='64' data-travel='1.3'><circle cx='1' cy='-0.5' r='2.52' fill='#e83bb0' fill-opacity='.42'/><circle cx='1' cy='-0.5' r='1.06' fill='#f7d7ee'/><circle cx='0.12' cy='-1.38' r='0.40' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(53 31) rotate(-62)'><path d='M-6.5 0 Q0 -4 6.5 0 Q0 4 -6.5 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='-62' data-travel='1.2'><circle cx='-1' cy='0.5' r='2.40' fill='#e83bb0' fill-opacity='.42'/><circle cx='-1' cy='0.5' r='1.01' fill='#f7d7ee'/><circle cx='-1.84' cy='-0.34' r='0.40' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(25 28) rotate(46)'><path d='M-5.5 0 Q0 -3.4 5.5 0 Q0 3.4 -5.5 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='46' data-travel='1.2'><circle cx='0.5' cy='0' r='2.04' fill='#e83bb0' fill-opacity='.42'/><circle cx='0.5' cy='0' r='0.90' fill='#f7d7ee'/><circle cx='-0.21' cy='-0.71' r='0.40' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(39 30) rotate(-50)'><path d='M-5 0 Q0 -3 5 0 Q0 3 -5 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='-50' data-travel='1.2'><circle cx='-1' cy='0.5' r='1.80' fill='#e83bb0' fill-opacity='.42'/><circle cx='-1' cy='0.5' r='0.90' fill='#f7d7ee'/><circle cx='-1.63' cy='-0.13' r='0.40' fill='#fff' fill-opacity='.9'/></g></g><g transform='translate(33 37) rotate(-5)'><path d='M-15 0 Q0 -9 15 0 Q0 9 -15 0 Z' fill='#e83bb0' fill-opacity='.12' stroke='#e83bb0' stroke-width='1.7'/><g class='pupil eye-pupil' data-tilt='-5' data-travel='2.7'><circle cx='2.5' cy='-1.5' r='5.40' fill='#e83bb0' fill-opacity='.42'/><circle cx='2.5' cy='-1.5' r='2.27' fill='#f7d7ee'/><circle cx='0.61' cy='-3.39' r='0.86' fill='#fff' fill-opacity='.9'/></g></g><circle cx='36' cy='34' r='.9' fill='#ffffff' fill-opacity='.85'/></g></g><svg viewBox="0 0 600 200" width="600" height="200" x="172" y="5" role="img" aria-label="yhwach">
  <title>yhwach</title>
  <style>
    :root { --ink: #ECE8E1; --dim: #8A8580; --red: #E5383B; }
    @media (prefers-color-scheme: light) {
      :root { --ink: #121214; --dim: #6B6660; --red: #D62828; }
    }
    .ink   { stroke: #f4e9f1; }
    .ghost { stroke: #e83bb0; opacity: .55; }
    .acc   { stroke: #e83bb0; }
    .glyph { fill: none; stroke-width: 12; stroke-linejoin: miter; stroke-miterlimit: 3; stroke-linecap: butt; }
    .frame { fill: none; stroke: #a3839a; stroke-width: 2; }
    .tag   { fill: #a3839a; font: 600 13px ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 3.2px; }
    .tag b { fill: #e83bb0; }
    .cur   { fill: #e83bb0; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <!-- custom angular letterforms: y h w a c h -->
    <g id="word">
      <path transform="translate(40 40)"  d="M0 0 L30 42 L60 0 M30 42 V84"/>
      <path transform="translate(120 40)" d="M0 0 V84 M0 34 H40 L60 54 V84"/>
      <path transform="translate(200 40)" d="M0 0 L14 84 L30 30 L46 84 L60 0"/>
      <path transform="translate(280 40)" d="M0 84 V22 L22 0 H60 V84"/>
      <path transform="translate(360 40)" d="M60 0 H22 L0 22 V62 L22 84 H60"/>
      <path transform="translate(440 40)" d="M0 0 V84 M0 34 H40 L60 54 V84"/>
    </g>
    <clipPath id="slice"><rect x="0" y="58" width="600" height="7"/></clipPath>
  </defs>

  <!-- corner brackets -->

  <!-- red chromatic offset -->
  <use href="#word" class="glyph ghost" transform="translate(-4 3)"/>
  <!-- main word -->
  <use href="#word" class="glyph ink"/>
  <!-- the 'a' crossbar as accent -->
  <path class="glyph acc" transform="translate(280 40)" d="M0 50 H60"/>
  <!-- glitch slice: a thin band displaced sideways -->
  <g clip-path="url(#slice)">
    <use href="#word" class="glyph ink" transform="translate(10 0)"/>
  </g>

  <!-- terminal cursor -->
  <rect class="cur" x="522" y="112" width="30" height="12"/>

  <!-- tagline -->
  <text class="tag" x="40" y="180"><tspan fill="#e83bb0">//</tspan> AI PENTEST KNOWLEDGE ENGINE</text>
</svg>
</svg>