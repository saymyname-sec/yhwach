# Yhwach — cross-cutting primitives.
# These rules aren't techniques; they're invariants the ranker enforces.

- id: technique_exhaustion
  kind: invariant
  description: |
    Any technique whose `technique_state` row is `consumed` for this engagement
    MUST NOT be re-ranked. OSAI labs do not reuse the same infra flaw twice.
    Rationale: seeing a pypi typosquat land once means you will not find another
    one in the same lab; wasting turns re-suggesting it is a common LLM failure.
  applies_to: all_hypotheses
  action: filter_out
  authorized_only: true

- id: credential_reuse
  kind: invariant
  description: |
    Recovered credentials are NEVER exhausted. Every credential in the vault is
    a valid input to every future host. The spray primitive is always live once
    the vault is non-empty.
  applies_to: credential
  action: always_available
  authorized_only: true

- id: high_ev_leads
  kind: escalator
  description: |
    Artifacts that historically produce a credential path in OSAI-style labs.
    When seen, promote the containing hypothesis to P0.
  triggers:
    - chrome_login_data        # Chrome DPAPI credential blob
    - keepass_kdbx             # KeePass DB on disk
    - unattend_xml             # Windows sysprep artifact with plaintext creds
    - powershell_history       # PSReadline history with commands / secrets
    - dpapi_master_key         # DPAPI blob path
    - lsa_defaultpassword      # LSA DefaultPassword / autologon secret (often a domain cred)
    - putty_session_reg        # PuTTY saved session with password
    - firefox_logins_json      # Firefox profile
    - browser_wallet_extension # crypto wallet or password manager extension state
  action: promote_p0
  authorized_only: true

- id: lore_denylist
  kind: filter
  description: |
    OffSec build/dev artifacts that appear in labs but are NEVER attack paths.
    Explicit denylist; grows every lab where noise is confused for a lead.
  entries_file: lore_denylist.yaml
  action: tag_dev_artifact_and_filter
  authorized_only: true

- id: bootstrap_recon
  kind: fallback
  description: |
    The rule the operator falls back to when the state slice is empty. Ensures
    the Contract is never silent — always emits a "run initial recon" action.
  emits:
    - action: run_initial_hexstrike_smart_scan
  authorized_only: true

# --- OPSEC invariants (self-learned from Shadow Supply + Iron Crown) ---

- id: opsec_qdrant_detection_rules
  kind: invariant
  description: |
    ALWAYS read the Qdrant detection_rules collection (or equivalent security
    policy store) BEFORE taking offensive action against an AI target. OSAI labs
    store YARA/Sigma-style rules in vector DBs; tripping them may fail the
    objective or trigger an alert that blocks further progress.
    Self-learned from Shadow Supply: Qdrant contained detection rules that would
    have caught unscreened exploit traffic.
  applies_to: vectordb_actions
  action: pre_check
  authorized_only: true

- id: opsec_never_hexstrike_metasploit
  kind: invariant
  description: |
    NEVER use HexStrike's metasploit_run MCP tool. It is unreliable, creates
    sessions that are hard to control, and has burned lab time in every
    engagement where it was used. Use standalone exploit scripts or manual
    MSF console instead.
    Confirmed across Iron Crown + Shadow Supply + multiple module labs.
  applies_to: hexstrike_actions
  action: filter_out
  authorized_only: true

- id: pwn3d_auto_screenshot
  kind: escalator
  description: |
    When a host reaches stage "pwn3d" (DA / root / objective flag captured),
    automatically trigger the screenshot pipeline and record a milestone note
    with the proof. This ensures exam evidence is captured before the session
    state changes.
    Added per Kapi's explicit request: notes + screenshots on every milestone.
  triggers:
    - stage_pwn3d
  action: auto_screenshot_and_note
  authorized_only: true
