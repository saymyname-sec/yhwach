# Yhwach — Active Directory playbook. Post-enumeration attack chains that fire
# off findings tagged by the AD parsers (interpret.py): ldap_anon, null_session,
# smb_signing_off, domain_users, asreproastable, kerberoastable.
#
# All class:traditional (below AI hosts by doctrine). The enumeration that SETS
# these tags is in playbooks/traditional.yaml (smb/ldap rules); these rules are
# the follow-on attacks the planner ranks once the tag exists.

# Kerberos on a DC (port 88) — first-contact user enumeration. Detected by the
# probe but nothing acted on it before; kerbrute validates a user list with no
# creds, which then unlocks AS-REP roast (domain_users).
- id: kerberos_user_enum
  when: { surface: kerberos }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: kerbrute_userenum
  maps: [T1589.002]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . kerberos user enumeration (kerbrute)'
  authorized_only: true

# Read the password policy (lockout threshold) before any spraying. Enumeration
# only, but doctrine-critical: a wrong throttle locks accounts.
- id: smb_password_policy
  when: { surface: smb }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: netexec_pass_pol
  maps: [T1201]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . pwd-spraying: check Account Lockout Threshold first'
  authorized_only: true

# SMB null/guest session -> RID cycling resolves SIDs to usernames when anon
# LDAP is closed. First-contact user enumeration; feeds domain_users.
- id: smb_rid_cycling
  when: { surface: smb }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: netexec_rid_brute
  maps: [T1087.002]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . RID cycling (netexec --rid-brute / lookupsid)'
  authorized_only: true

# Anonymous LDAP bind confirmed -> dump users/groups (feeds domain_users).
- id: ldap_anon_dump
  when: { surface: ldap, findings_include: ldap_anon }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: ldap_anon_dump
  maps: [T1087.002]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . anonymous LDAP -> users/groups'
  authorized_only: true

# A domain user list exists -> AS-REP roast (needs no creds).
- id: asrep_roast
  when: { surface: kerberos, findings_include: domain_users }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: asreproast_users
  maps: [T1558.004]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'hacktricks . AS-REP roasting (GetNPUsers, no preauth)'
  technique: asrep_roast
  authorized_only: true

# We hold a domain cred -> probe for coercible services (Spooler / WebClient).
- id: smb_coercible_service_check
  when: { surface: smb, vault: nonempty }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: nxc_coerce_service_check
  maps: [T1187]
  points: 10
  risk: read_only
  routes: /osai-relay
  source: 'internalallthethings . detect Spooler/WebClient before coercing (nxc -M spooler/webdav)'
  authorized_only: true

# A coercible service is up -> force machine auth to a waiting relay/listener.
- id: coerce_authentication_to_relay
  when: { findings_include: coercion_target }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: coerce_authentication
  maps: [T1187, T1557.001]
  points: 15
  risk: propose
  routes: /osai-relay
  source: 'internalallthethings . coerce_plus PrinterBug/PetitPotam/DFSCoerce -> ntlmrelayx'
  technique: coercion
  authorized_only: true

# SMB signing not required -> NTLM relay (pair with a coercion).
- id: smb_ntlm_relay
  when: { surface: smb, findings_include: smb_signing_off }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: ntlmrelay_setup
  maps: [T1557.001]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'hacktricks . NTLM relay to SMB (signing disabled)'
  technique: ntlm_relay
  authorized_only: true

# Kerberoastable SPN captured -> crack the TGS (host-scoped: no surface needed).
- id: kerberoast
  when: { findings_include: kerberoastable }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: kerberoast_getuserspns
  maps: [T1558.003]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'hacktricks . Kerberoasting (GetUserSPNs)'
  technique: kerberoast
  authorized_only: true

# --- BloodHound-driven chains (tags set by the bloodhound ingest parser) ---

# DCSync rights on a principal -> dump NTDS -> Domain Admin (host-scoped: the DC).
- id: dcsync
  when: { findings_include: dcsync }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: dcsync_secretsdump
  maps: [T1003.006]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'bloodhound . DCSync (replication rights) -> secretsdump'
  technique: dcsync
  authorized_only: true

# Unconstrained delegation host -> coerce the DC and capture its TGT.
- id: unconstrained_delegation_abuse
  when: { findings_include: unconstrained_delegation }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: unconstrained_delegation_capture
  maps: [T1558]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'bloodhound . unconstrained delegation -> coerce + TGT capture'
  technique: unconstrained_delegation
  authorized_only: true

# --- Phase 4c: ADCS, GPP, creds-aware kerberoast ---

# certipy flagged a vulnerable template (adcs_vuln) -> request a priv cert (host-scoped: the CA/DC).
- id: adcs_esc_abuse
  when: { findings_include: adcs_vuln }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: certipy_request
  maps: [T1649]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'certipy . ADCS ESC template abuse -> cert as a privileged UPN'
  technique: adcs_abuse
  authorized_only: true

# GPP cpassword recovered (SYSVOL Groups.xml) -> decrypt with the public AES key.
- id: gpp_decrypt
  when: { findings_include: gpp_password }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: gpp_decrypt
  maps: [T1552.006]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'hacktricks . GPP cpassword (public AES key)'
  authorized_only: true

# A writable Tier-0 principal (GenericWrite/WriteDACL/AddKeyCredentialLink over a
# Domain Admins member) -> shadow credential -> PKINIT -> NT hash -> PtH -> DA.
# Tag set by the bloodhound ingest (fact kind shadow_cred_target). Host-scoped
# (the DC/target); fires as soon as the fact lands, and it IS the DA path.
- id: shadow_credential_abuse
  when: { findings_include: shadow_cred_target }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: bloodyad_shadow_cred
  maps: [T1556]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'bloodhound + bloodyAD . GenericWrite on a DA member -> msDS-KeyCredentialLink -> PKINIT -> NT hash -> PtH'
  technique: shadow_credential
  authorized_only: true

# We hold a domain cred -> try to read LAPS (ms-Mcs-AdmPwd). A hit is instant
# local admin on that machine.
- id: ldap_laps_read
  when: { surface: ldap, vault: nonempty }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: netexec_laps
  maps: [T1552.001]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . read LAPS ms-Mcs-AdmPwd (netexec -M laps / bloodyAD)'
  authorized_only: true

# We hold a domain cred -> hunt for passwords parked in user description /
# userPassword / unixUserPassword / unicodePwd attributes.
- id: ldap_user_descriptions
  when: { surface: ldap, vault: nonempty }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: netexec_get_desc_users
    - action: bloodyad_password_fields
  maps: [T1552.001]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . passwords in AD user descriptions (get-desc-users)'
  authorized_only: true

# We hold a domain cred -> read MachineAccountQuota (enumeration). >0 unlocks RBCD.
- id: ldap_machineaccountquota
  when: { surface: ldap, vault: nonempty }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: netexec_maq
  maps: [T1087.002]
  points: 10
  risk: read_only
  routes: /osai-ad-attack
  source: 'internalallthethings . MachineAccountQuota enumeration (netexec -M maq)'
  authorized_only: true

# MachineAccountQuota > 0 -> add a computer, set RBCD, S4U as Administrator.
- id: rbcd_machineaccountquota_abuse
  when: { findings_include: machine_account_quota }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: rbcd_addcomputer_attack
  maps: [T1078, T1558]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'internalallthethings . MachineAccountQuota abuse -> RBCD -> service ticket as admin'
  technique: rbcd_maq
  authorized_only: true

# We hold domain creds and there is an LDAP/DC surface -> kerberoast with creds
