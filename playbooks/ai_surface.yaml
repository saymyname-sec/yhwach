# Yhwach — AI-surface playbook. Rules for LLM / agent / RAG / MCP / A2A /
# embedding attack surfaces.
#
# Each rule cites a source (OSAI module + OWASP-LLM class), carries static EV
# inputs (likelihood H/M/L, time_cost fast/med/slow), and either an action or a
# route to an existing skill.
#
# `when` clauses match the surface KINDS the probes actually emit:
#   ollama | openai_compat | chatbot | mcp | gradio | a2a | vectordb
# (a2a and vectordb probes land in a later phase; their rules are here and will
#  start matching automatically once those surfaces get populated.)

- id: ollama_unauth_api
  when: { surface: ollama, auth: none }
  likelihood: H
  time_cost: fast
  emits:
    - action: probe_ollama_models
    - action: try_direct_generate
  maps: [LLM06]
  points: 15
  risk: read_only
  routes: /osai-mcp-attack
  source: 'osai/07 . README:AI-ports'
  authorized_only: true

- id: openai_compat_models
  when: { surface: openai_compat }
  likelihood: H
  time_cost: fast
  emits:
    - action: enumerate_models
    - action: attempt_completion_unauth
  maps: [LLM02, LLM06]
  points: 15
  risk: read_only
  routes: /osai-ai-hunter
  source: 'osai/02 . endpoint_fuzz.sh'
  authorized_only: true

