# Yhwach — message-broker playbook.
#
# Self-learned from Challenge Lab 3 (Iron Crown): BROKER01 ran ActiveMQ 5.17.4
# (MQTT 1883 / AMQP 5672 / console 8161) as the bus wiring the AI agents. In an
# AI environment a message broker is BOTH a traditional RCE target (ActiveMQ
# CVEs) AND an A2A indirect-injection surface (agent messages flow through it).

- id: activemq_rce
  when: { surface: activemq }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: activemq_version_jolokia
    - action: activemq_default_creds
    - action: activemq_openwire_cve_check
  maps: [CVE-2023-46604]
  points: 10
  risk: propose
  routes: /osai-web-exploit
  source: 'CVE-2023-46604 . Apache ActiveMQ OpenWire RCE (<5.15.16/5.16.7/5.17.6/5.18.3)'
  authorized_only: true

- id: activemq_openwire_rce
  when: { surface: activemq_openwire }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: activemq_openwire_cve_check
  maps: [CVE-2023-46604]
  points: 10
  risk: propose
  routes: /osai-web-exploit
  source: 'CVE-2023-46604 . OpenWire :61616 direct RCE'
  authorized_only: true

- id: mqtt_agent_bus
  when: { surface: mqtt }
  class: ai                       # broker often carries AI/A2A agent traffic
  likelihood: M
  time_cost: fast
  emits:
    - action: mqtt_subscribe_all
    - action: mqtt_publish_injection
  maps: [LLM01, LLM06]
  points: 15
  risk: propose
  routes: /osai-a2a
  source: 'osai/04 . A2A indirect injection via message bus'
  authorized_only: true

- id: amqp_agent_bus
  when: { surface: amqp }
  class: ai
  likelihood: M
  time_cost: fast
  emits:
    - action: amqp_enum_queues
  maps: [LLM01, LLM06]
  points: 15
  risk: read_only
  routes: /osai-a2a
  source: 'osai/04 . A2A message bus (AMQP)'
  authorized_only: true
