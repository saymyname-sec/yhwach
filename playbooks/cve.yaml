# Yhwach — known-CVE exploitation (schema v1 activation).
#
# `yhwach vulns` matches software versions against the offline CVE knowledge base
# (data/cve_map.yaml) and tags a host `exploitable_cve` when a matched CVE has a
# known exploit. This rule turns that into a ranked, propose-tier move. The
# concrete exploit_ref (msf module / searchsploit id / nuclei template) is on the
# vulnerability row — `yhwach recon --host` prints it.
#
# class is left unset: version-matched CVEs are traditional by default, but an AI
# service CVE (Ollama/MLflow/Ray/Gradio) carries an AI map so the ranker still
# tiers it correctly once the surface is also known.

- id: exploit_known_cve
  when: { findings_include: exploitable_cve }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: exploit_known_cve
  maps: [T1210]
  points: 15
  risk: propose
  routes: /osai-exploit
  source: 'yhwach cve_map . offline version->CVE with known exploit'
  authorized_only: true
