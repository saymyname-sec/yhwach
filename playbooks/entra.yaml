# I33 — Entra / hybrid-identity. The producers are detected from the on-prem AD
# graph (yhwach/entra.py). The report rule always fires; the exploit rules are
# GATED behind cloud_tenant_in_scope so they never fire on a pure on-prem AD
# assessment that merely observed the Azure AD Connect account.

- id: hybrid_identity_investigate
  when: { findings_include: hybrid_identity }
  class: ad
  likelihood: M
  time_cost: low
  emits:
    - action: hybrid_identity_map
  maps: [T1078.004]
  points: 10
  risk: read_only
  routes: 'hacktricks-cloud . azure hybrid'
  source: 'technique: map the hybrid trust (AD Connect server, ADFS, Seamless SSO) before touching the tenant'
  authorized_only: true

- id: adconnect_credential_extraction
  when: { findings_include: adconnect_host, cloud_tenant_in_scope: true }
  class: ad
  likelihood: H
  time_cost: med
  emits:
    - action: adconnect_creds
  maps: [T1552.001, T1078.004]
  points: 15
  risk: propose
  routes: 'hacktricks-cloud . azure ad connect'
  source: 'technique: AADInternals/adconnectdump the sync credential -> directory-wide password resync'
  authorized_only: true

- id: seamless_sso_silver_ticket
  when: { findings_include: hybrid_identity, cloud_tenant_in_scope: true }
  class: ad
  likelihood: M
  time_cost: med
  emits:
    - action: aadssoacc_silver_ticket
  maps: [T1550.003]
  points: 15
  risk: propose
  routes: 'hacktricks-cloud . seamless sso'
  source: 'technique: AZUREADSSOACC$ hash -> forge a silver ticket to the SSO endpoint (cloud access)'
  authorized_only: true
