# Yhwach — SMB lateral-movement playbook (schema v1 activation).
#
# Fires off the facts the NetExec ingest sets (yhwach/parsers/netexec.py ->
# yhwach/ingest.py): writable_share, admin_access. These turn recorded SMB reach
# into concrete next moves. All class:traditional (below AI hosts by doctrine).
# The enumeration that SETS these tags is `yhwach ingest --kind netexec`.

# Writable SMB share -> loot + stage a payload / coerce a NetNTLM callback.
- id: smb_writable_share_abuse
  when: { findings_include: writable_share }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: smb_writable_share_loot_and_stage
  maps: [T1135, T1080]
  points: 10
  risk: propose
  routes: /osai-ad-attack
  source: 'internalallthethings . writable share -> loot / coercion'
  authorized_only: true

# Local admin (Pwn3d!) on a host -> dump secrets, feed the credential vault.
- id: smb_admin_secretsdump
  when: { findings_include: admin_access }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: smb_secretsdump_with_admin
  maps: [T1003.002, T1003.001]
  points: 15
  risk: propose
  routes: /osai-ad-attack
  source: 'internalallthethings . local admin -> secretsdump -> credential reuse'
  authorized_only: true
