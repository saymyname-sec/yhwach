# I43 — classic network services every internal engagement meets. The surface
# kinds come from the protocol-aware classify_service (TCP + UDP). Triage is
# read_only by default; the dangerous moves are GATED (risk: propose) per the
# reviewer correction: open-relay tests, printer default logins, NFS mounts and
# IPMI hash dumps are NOT read-only.

- id: snmp_triage
  when: { surface: snmp }
  class: traditional
  likelihood: M
  time_cost: low
  emits:
    - action: snmp_walk
  maps: [T1046]
  points: 10
  risk: read_only
  routes: 'hacktricks . pentesting/pentesting-snmp'
  source: 'technique: SNMP public/private community walk (sysDescr, processes, routes)'
  authorized_only: true

- id: dns_triage
  when: { surface: dns }
  class: traditional
  likelihood: M
  time_cost: low
  emits:
    - action: dns_version
    - action: dns_axfr
  maps: [T1590.002]
  points: 10
  risk: read_only
  routes: 'hacktricks . pentesting/pentesting-dns'
  source: 'technique: DNS version.bind + AXFR zone-transfer attempt (read-only recon)'
  authorized_only: true

- id: rpcbind_triage
  when: { surface: rpcbind }
  class: traditional
  likelihood: M
  time_cost: low
  emits:
    - action: rpc_info
  maps: [T1046]
  points: 5
  risk: read_only
  routes: 'hacktricks . pentesting/pentesting-rpcbind'
  source: 'technique: rpcinfo portmapper dump — reveals NFS/NIS/mountd behind 111'
  authorized_only: true

- id: nfs_triage
  when: { surface: nfs }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: nfs_showmount
    - action: nfs_mount          # GATED: mounting is an active change, not recon
  maps: [T1039]
  points: 15
  risk: propose
  routes: 'hacktricks . pentesting/nfs-service-pentesting'
  source: 'technique: showmount -e exports (read-only) then no_root_squash mount (gated)'
  authorized_only: true

