  maps: [CWE-538, CWE-200]
  points: 10
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: a COPY+rm''d secret survives in an earlier container-registry image layer (CWE-538)'
  technique: registry_layer_secret
  authorized_only: true

# A repo whose pipeline reclassifies docs SENSITIVE/NON-SENSITIVE and publishes
# the NON-SENSITIVE set -> poison the training data so a withheld cred doc is
# relabelled and published (LLM04 data poisoning). classifier_repo is context-set.
- id: gitlab_classifier_training_poison
  when: { surface: gitlab, findings_include: classifier_repo }
  class: ai
  likelihood: M
  time_cost: slow
  emits:
    - action: gitlab_training_data_poison
  maps: [LLM04, LLM03]
  points: 15
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: poison a classifier''s training set so a withheld-sensitive doc is relabelled non-sensitive and published (LLM04/LLM03)'
  technique: classifier_poison
  authorized_only: true

# --- Scheduled git-pull-and-import -> poison the module for RCE ---
# A workflow/cron that git-pulls a repo with a leaked credential.helper cred and
# then imports it (import_module) executes clf/__init__.py on every run. If the
# leaked cred has push access, poison __init__.py -> RCE as the runtime user.
- id: gitea_deploy_poison_rce
  when: { findings_include: git_import_pipeline }
  class: ai
  likelihood: H
  time_cost: med
  emits:
    - action: poison_git_imported_module
  maps: [CWE-94, LLM05]
  points: 15
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: a scheduled git-pull-and-import runs clf/__init__.py every run -> poison the imported module for RCE (CWE-94)'
  technique: git_import_poison
  authorized_only: true

