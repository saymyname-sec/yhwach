# Yhwach — supply-chain playbook.
#
# Self-learned from Shadow Supply (Challenge Lab): numpy.py hijack, PyPI
# dependency poisoning, GitLab CI/CD variable exfiltration, Vault token theft.
# Also incorporates patterns from OSAI modules 8 (code review evasion) and 11
# (training pipeline attacks).
#
# Supply chain rules sit at the intersection of AI and traditional: the vector
# is code/package/CI, but the target is often an AI pipeline or model.

- id: pypi_supply_chain_inspect
  when: { surface: web, findings_include: python_requirements }
  class: ai
  likelihood: M
  time_cost: med
  emits:
    - action: pip_requirements_audit
    - action: pypi_package_inspect
  maps: [LLM05, CWE-506]
  points: 15
  risk: propose
  routes: /osai-supplychain
  source: 'shadow-supply . Chain 2: numpy.py hijack replaced real numpy on import'
  authorized_only: true

- id: gitlab_ci_variable_exfil
  when: { surface: gitlab, findings_include: gitlab_token }
  class: ai
  likelihood: H
  time_cost: fast
  emits:
    - action: gitlab_ci_variables
    - action: gitlab_runner_enum
    - action: gitlab_direct_api_commit
  maps: [LLM06, CWE-200]
  points: 15
  risk: propose
  routes: /osai-supplychain
  source: 'shadow-supply . Chain 4: CI vars contained Vault tokens + service creds'
  authorized_only: true

- id: vault_token_exploitation
  when: { surface: vault }
  class: ai
  likelihood: H
  time_cost: fast
  emits:
    - action: vault_health_check
    - action: vault_token_lookup
    - action: vault_list_secrets
    - action: vault_read_secret
  maps: [LLM06, CWE-200]
  points: 15
  risk: propose
  routes: /osai-supplychain
  source: 'shadow-supply . Chain 5: Vault token from CI yielded DA service account'
  authorized_only: true

