# model_checkpoint_load tag is set from the RAG "answer key" / recon that reveals
# the refresh-from-registry pattern (like the pickle_endpoint / training_pipeline
# tags, it is operator/context-set, not auto-extracted).
- id: model_checkpoint_pickle_rce
  when: { findings_include: model_checkpoint_load }
  class: ai
  likelihood: H
  time_cost: med
  emits:
    - action: craft_torch_checkpoint_pickle
  maps: [LLM03, CWE-502]
  points: 15
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: a model server that torch.load()s auto-pulled checkpoints executes a poisoned .pt pickle (CWE-502)'
  technique: model_pickle
  authorized_only: true

