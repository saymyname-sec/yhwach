# --- GitLab open-registration -> PAT -> classifier poisoning + registry loot ---
# Self-registration is often enabled and auto-grants Reporter/Developer on
# internal groups. Register, mint a PAT (unlocks the CI-exfil chain), and pull
# the container registry (secrets survive in earlier image layers before an rm).
- id: gitlab_open_registration
  when: { surface: gitlab }
  class: ai
  likelihood: M
  time_cost: fast
  emits:
    - action: gitlab_open_register
    - action: gitlab_create_pat
  maps: [CWE-1188, CWE-200]
  points: 10
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: GitLab open registration often auto-grants Reporter/Developer on internal groups -> mint a PAT'
  authorized_only: true

- id: gitlab_registry_layer_secret
  when: { surface: gitlab, findings_include: gitlab_token }
  class: ai
  likelihood: M
  time_cost: med
  emits:
