# Yhwach — supply-chain playbook.
#
# Supply-chain vectors: local-module / package / dependency poisoning, GitLab
# CI/CD variable exfiltration, Vault token theft, model-checkpoint poisoning,
# and AI code-review evasion. The vector is code/package/CI; the target is often
# an AI pipeline or model.
#
# Supply chain rules sit at the intersection of AI and traditional: the vector
# is code/package/CI, but the target is often an AI pipeline or model.

- id: pypi_supply_chain_inspect
  when: { surface: web, findings_include: python_requirements }
  class: ai
  likelihood: M
  time_cost: med
  emits:
    - action: pip_requirements_audit
    - action: pypi_package_inspect
  maps: [LLM05, CWE-506]
  points: 15
  risk: propose
  routes: 'yhwach ref ai-attacks -q model_supply_chain'
  source: 'technique: local-module shadowing — a repo-local numpy.py hijacks the real package on import (CWE-506)'
  authorized_only: true

