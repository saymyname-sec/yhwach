# --- n8n (workflow automation) — CVE-2026-21858 "Ni8mare" chain (synthetic_siege) ---
# n8n < 1.121.0 form-trigger content-type confusion = unauth arbitrary TEXT file read.
# Fingerprint the version first (gates the exploit deterministically, like ollama).
- id: n8n_workflow_recon
  when: { surface: web, product: n8n }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: probe_n8n_version
  maps: [CWE-200]
  points: 10
  risk: read_only
  routes: /osai-web-exploit
  source: 'synthetic_siege . n8n form-trigger fingerprint (Ni8mare gate)'
  authorized_only: true

