# --- MSSQL sa -> SQL CLR in-process assembly load = AMSI/Defender bypass (obj5) ---
# When Defender/AMSI block every PE on disk and in-memory Assembly.Load, sqlservr
# will load a .NET assembly straight from T-SQL bytes into its own process — no
# disk write, no AMSI scan, no command line. sa can enable CLR + UNSAFE and run it.
- id: mssql_sqlclr_code_exec
  when: { surface: mssql, vault: nonempty }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: mssql_sqlclr_assembly_load
  maps: [CWE-269, T1055]
  points: 15
  risk: propose
  routes: /osai-win-enum
  source: 'synthetic_siege . CREATE ASSEMBLY ... UNSAFE loads a potato in-process, bypassing Defender/AMSI'
  technique: mssql_sqlclr
  authorized_only: true

# --- nginx default_server catch-all -> mandatory vhost fuzzing (obj1 lead) ---
# A web server that returns a UNIFORM response (same size/body) for every path
# and unknown host is an nginx default_server masking name-based vhosts — NOT a
# decoy. Fuzz the Host header (filter the catch-all size) to find the real apps.
- id: nginx_catchall_vhost_fuzz
  when: { surface: web }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: vhost_fuzz
  maps: [CWE-200]
  points: 10
  risk: read_only
  routes: /osai-web-exploit
  source: 'synthetic_siege . a uniform catch-all (default_server) hid portal/trials vhosts (obj1)'
  technique: vhost_fuzz
  authorized_only: true

