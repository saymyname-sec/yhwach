# Yhwach — traditional (non-AI) playbook. Foothold / lateral / enumeration rules
# for the services Yhwach fingerprints outside the AI surface set.
#
# All carry class:traditional, so the ranker keeps them BELOW any AI hypothesis
# by doctrine (AI hosts are the OSAI pass mark). Points ~10 (traditional value).
# `when` matches the surface kinds detect_traditional() emits: jenkins | gitlab |
# web | smb | ldap | ssh | mssql | winrm | rdp | ftp | mysql.

- id: jenkins_script_console_rce
  when: { surface: jenkins }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: jenkins_auth_check
    - action: jenkins_script_console
    - action: jenkins_cred_dump
  maps: [CWE-94]
  points: 10
  risk: propose
  routes: /osai-web-exploit
  source: 'hacktricks . pentesting-web/jenkins'
  authorized_only: true

