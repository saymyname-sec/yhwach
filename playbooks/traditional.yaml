# Yhwach — traditional (non-AI) playbook. Foothold / lateral / enumeration rules
# for the services Yhwach fingerprints outside the AI surface set.
#
# All carry class:traditional, so the ranker keeps them BELOW any AI hypothesis
# by doctrine (AI hosts are the OSAI pass mark). Points ~10 (traditional value).
# `when` matches the surface kinds detect_traditional() emits: jenkins | gitlab |
# web | smb | ldap | ssh | mssql | winrm | rdp | ftp | mysql.

- id: jenkins_script_console_rce
  when: { surface: jenkins }
  class: traditional
  likelihood: H
  time_cost: med
  emits:
    - action: jenkins_auth_check
    - action: jenkins_script_console
    - action: jenkins_cred_dump
  maps: [CWE-94]
  points: 10
  risk: propose
  routes: /osai-web-exploit
  source: 'hacktricks . pentesting-web/jenkins'
  authorized_only: true

# A plain web surface may be an oauth2-proxy fronting a backend. Its
# skip_auth_routes often uses an unanchored \.(js|css|..)$ regex; Jenkins/Stapler
# ignores a trailing /x.css suffix, so the pair bypasses auth. Recon only here.
- id: oauth2proxy_static_suffix_bypass
  when: { surface: web }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: jenkins_oauth2proxy_bypass
  maps: [CWE-287, CVE-2025-54576]
  points: 10
  risk: read_only
  routes: /osai-web
  source: 'double_hellix . oauth2-proxy skip_auth_routes unanchored ext regex + Jenkins Stapler suffix'
  authorized_only: true

# The bypass probe reached Jenkins (tag jenkins_unsecured) -> anonymous Groovy
# script console RCE through the same /x.css suffix. Host-scoped.
- id: jenkins_unsecured_console_rce
  when: { findings_include: jenkins_unsecured }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: jenkins_suffix_console_rce
    - action: jenkins_cred_dump
  maps: [CWE-94, CWE-287]
  points: 15
  risk: propose
  routes: /osai-web
  source: 'double_hellix . anonymous Jenkins script console via the proxy-bypass suffix (authZ=Unsecured)'
  technique: jenkins_suffix_rce
  authorized_only: true

