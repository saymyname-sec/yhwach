# Unfinished setup exposed (setup_incomplete, set by the webapp_setup_probe
# extractor). Scoped to metabase: a leaked setup-token is pre-auth RCE. Superset's
# default-SECRET_KEY forge needs a different producer (deferred). Exploit-tier.
- id: metabase_setup_token_rce
  when: { surface: metabase, findings_include: setup_incomplete }
  class: traditional
  likelihood: H
  time_cost: med
