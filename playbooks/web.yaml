# Yhwach — web-surface playbook (schema v1 activation).
#
# Fires off the interesting web paths the web ingest records
# (yhwach/parsers/web.py -> yhwach/ingest.py sets one finding per path kind):
# web_login, web_upload, web_git, web_api, web_backup. Content discovery
# (gobuster/ffuf/feroxbuster) SETS these via `yhwach ingest --kind web`.
# class:traditional — web is ranked below AI surfaces by doctrine, but a web->RCE
# (upload) is a high-points foothold, so it is ranked accordingly within the tier.

# Exposed .git / VCS metadata -> reconstruct source + mine history for secrets.
- id: web_git_source_dump
  when: { findings_include: web_git }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: web_git_dump
  maps: [T1552.001, CWE-527]
  points: 12
  risk: read_only
  routes: 'HexStrike web stack'
  source: 'internalallthethings . exposed .git -> git-dumper'
  authorized_only: true

# File-upload surface -> unrestricted upload -> webshell RCE (top web foothold).
- id: web_upload_rce
  when: { findings_include: web_upload }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: web_upload_webshell
  maps: [T1505.003, CWE-434]
  points: 15
  risk: propose
  routes: 'HexStrike web stack'
  source: 'OWASP WSTG . unrestricted file upload -> RCE'
  authorized_only: true

