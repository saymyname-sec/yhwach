# Yhwach — web-surface playbook (schema v1 activation).
#
# Fires off the interesting web paths the web ingest records
# (yhwach/parsers/web.py -> yhwach/ingest.py sets one finding per path kind):
# web_login, web_upload, web_git, web_api, web_backup. Content discovery
# (gobuster/ffuf/feroxbuster) SETS these via `yhwach ingest --kind web`.
# class:traditional — web is below AI hosts by doctrine, but a web->RCE
# (upload) is a high-points foothold, so it is ranked accordingly within the tier.

# Exposed .git / VCS metadata -> reconstruct source + mine history for secrets.
- id: web_git_source_dump
  when: { findings_include: web_git }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: web_git_dump
  maps: [T1552.001, CWE-527]
  points: 12
  risk: read_only
  routes: /osai-web-attack
  source: 'internalallthethings . exposed .git -> git-dumper'
  authorized_only: true

# File-upload surface -> unrestricted upload -> webshell RCE (top web foothold).
- id: web_upload_rce
  when: { findings_include: web_upload }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: web_upload_webshell
  maps: [T1505.003, CWE-434]
  points: 15
  risk: propose
  routes: /osai-web-attack
  source: 'OWASP WSTG . unrestricted file upload -> RCE'
  authorized_only: true

# Login surface -> default/known creds, then a lockout-aware spray.
- id: web_login_creds
  when: { findings_include: web_login }
  class: traditional
  likelihood: M
  time_cost: med
  emits:
    - action: web_login_attack
  maps: [T1110.001, T1078]
  points: 8
  risk: propose
  routes: /osai-web-attack
  source: 'OWASP WSTG . auth: default creds / bounded spray'
  authorized_only: true

# API / Swagger surface -> enumerate the contract before fuzzing.
- id: web_api_recon
  when: { findings_include: web_api }
  class: traditional
  likelihood: M
  time_cost: fast
  emits:
    - action: web_api_enum
  maps: [T1596, CWE-200]
  points: 7
  risk: read_only
  routes: /osai-web-attack
  source: 'OWASP API Top 10 . discover the API contract'
  authorized_only: true

# Exposed backup/archive -> download and mine for source + credentials.
- id: web_backup_loot
  when: { findings_include: web_backup }
  class: traditional
  likelihood: H
  time_cost: fast
  emits:
    - action: web_backup_download
  maps: [T1552.001, CWE-530]
  points: 10
  risk: read_only
  routes: /osai-web-attack
  source: 'OWASP WSTG . exposed backup files'
  authorized_only: true
