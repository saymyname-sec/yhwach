[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yhwach"
version = "0.1.0"
description = "yhwach — AI-Driven Memory & Playbook: a persistent SQLite world-model, lessons-memory and playbook engine for AI-driven security operators."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "saymyname-sec" }]
keywords = ["red-team", "offensive-security", "mcp", "ai-security", "llm-security", "pentest", "world-model", "playbook", "memory"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]
mcp = [
    "mcp>=1.0,<2",
]
# The agent brain (wire 1): calls Claude via the Anthropic SDK. Optional so the
# engine, tests, and CI run without it or a key. See AGENT.md § Runtime.
agent = [
    "anthropic>=0.40",
]
# The agent brain, OpenAI provider. Same wire-1 seam, chosen at runtime
# (--provider openai / a gpt* --model / YHWACH_PROVIDER).
agent-openai = [
    "openai>=1.40",
]
# Both providers at once.
agent-all = [
    "yhwach[agent]",
    "yhwach[agent-openai]",
]
# The live board (read view over memory + kill/approve controls). Optional.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
yhwach = "yhwach.cli:main"

[project.urls]
Homepage = "https://github.com/saymyname-sec/yhwach"
Issues = "https://github.com/saymyname-sec/yhwach/issues"

[tool.hatch.build.targets.wheel]
packages = ["yhwach"]

# Bundle the data files that live outside the package so a non-editable install
# (a built wheel) ships schema, persona, playbooks, and fixtures. Runtime
# resolvers check these packaged locations first, then fall back to the repo
# layout for editable/source use (see __init__.py, playbooks.py, fixtures.py).
[tool.hatch.build.targets.wheel.force-include]
"db/schema.sql" = "yhwach/_schema.sql"
"persona/operator.md" = "yhwach/_operator.md"
"persona/notebook.md" = "yhwach/_notebook.md"
"playbooks" = "yhwach/_playbooks"
"tests/fixtures" = "yhwach/_fixtures"
"data/cve_map.yaml" = "yhwach/_cve_map.yaml"
"data" = "yhwach/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# Line length is owned by the formatter (black, 100); many action command
# templates are single long strings that don't benefit from wrapping.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately nest with/patch context managers for readability.
"tests/**" = ["SIM117"]

[tool.black]
line-length = 100
target-version = ["py311"]
